<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="L’entreprise"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F7F8" /><rect x="0" y="0" width="1440" height="90" rx="0" fill="white" /><text x="64" y="51" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">édysol</text><text x="64" y="72" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600">NOUVELLE-CALÉDONIE</text><a href="#p-accueil" data-target="p-accueil"><text x="520" y="53" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Accueil</text></a><a href="#p-prestations" data-target="p-prestations"><text x="620" y="53" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Prestations</text></a><a href="#p-entreprise" data-target="p-entreprise"><text x="750" y="53" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">L’entreprise</text></a><a href="#p-contact" data-target="p-contact"><text x="890" y="53" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Contact</text></a><a href="#connexion" data-target="connexion"><rect x="1015" y="24" width="160" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="1031" y="52" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Espace équipe</text></a><a href="#p-commande" data-target="p-commande"><rect x="1190" y="24" width="190" height="44" rx="9" fill="#085895" /><text x="1206" y="52" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Faire une demande</text></a><rect x="64" y="150" width="192" height="28" rx="14" fill="#58AB29" /><text x="76" y="169" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">PROXIMITÉ &amp; ORGANISATION</text><text x="64" y="242" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="600">Édysol, à vos côtés.</text><text x="64" y="302" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Une présentation de l’entreprise, de son histoire et de son métier</text><text x="64" y="328" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">sera intégrée après validation avec les deux cogérants.</text><rect x="64" y="422" width="640" height="260" rx="14" fill="white" /><text x="88" y="457" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Une équipe, des responsabilités claires</text><text x="90" y="492" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Deux cogérants pour le pilotage.</text><text x="90" y="518" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Une secrétaire pour le suivi de vos demandes.</text><text x="90" y="544" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Des employés mobilisés selon chaque intervention.</text><rect x="736" y="422" width="640" height="260" rx="14" fill="white" /><text x="760" y="457" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Un accompagnement du début à la fin</text><text x="762" y="492" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Une demande enregistrée et identifiable.</text><text x="762" y="518" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Une date confirmée avec vous.</text><text x="762" y="544" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Des informations transmises à l’équipe concernée.</text><a href="#p-contact" data-target="p-contact"><rect x="64" y="741" width="230" height="44" rx="9" fill="#085895" /><text x="80" y="769" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Échanger avec nous</text></a></svg>