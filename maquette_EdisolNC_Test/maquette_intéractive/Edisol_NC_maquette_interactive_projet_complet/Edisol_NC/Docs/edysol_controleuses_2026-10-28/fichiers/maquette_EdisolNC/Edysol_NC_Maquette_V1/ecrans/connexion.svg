<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Connexion professionnelle"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F7F8" /><rect x="0" y="0" width="660" height="1000" rx="0" fill="#085895" /><text x="70" y="100" fill="white" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700">édysol</text><text x="70" y="350" fill="white" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="400">Des équipes</text><text x="70" y="422" fill="white" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="400">coordonnées.</text><text x="70" y="494" fill="white" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="400">Des demandes</text><text x="70" y="566" fill="white" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="400">bien suivies.</text><text x="70" y="900" fill="#EDF2F6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Un accès personnel selon votre rôle.</text><rect x="750" y="148" width="600" height="660" rx="14" fill="white" /><text x="774" y="183" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Bienvenue dans votre espace</text><text x="774" y="210" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Maquette : choisir un rôle pour découvrir ses écrans.</text><text x="782" y="270" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Adresse e-mail</text><rect x="782" y="282" width="536" height="48" rx="8" fill="white" stroke="#DCE3E8" /><text x="796" y="312" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">votre.nom@entreprise.test</text><text x="782" y="364" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Mot de passe</text><rect x="782" y="376" width="536" height="48" rx="8" fill="white" stroke="#DCE3E8" /><text x="796" y="406" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">••••••••••••</text><text x="782" y="458" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Mot de passe oublié ? Contacter la personne responsable.</text><a href="#g-dashboard" data-target="g-dashboard"><rect x="782" y="510" width="536" height="44" rx="9" fill="#085895" /><text x="798" y="538" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Ouvrir la cogérance</text></a><a href="#s-dashboard" data-target="s-dashboard"><rect x="782" y="585" width="536" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="798" y="613" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Ouvrir le secrétariat</text></a><a href="#e-jour" data-target="e-jour"><rect x="782" y="660" width="536" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="798" y="688" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Ouvrir l’espace employé</text></a><a href="#su-accueil" data-target="su-accueil"><rect x="782" y="735" width="536" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="798" y="763" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Ouvrir l’espace contrôleuses</text></a></svg>