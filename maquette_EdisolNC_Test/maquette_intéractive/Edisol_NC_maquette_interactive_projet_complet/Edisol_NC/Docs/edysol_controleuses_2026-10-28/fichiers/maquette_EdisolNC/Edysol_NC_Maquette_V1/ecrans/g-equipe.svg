erif" font-size="12" font-weight="400">Compte de démonstration</text><a href="#connexion" data-target="connexion"><rect x="24" y="938" width="188" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="40" y="966" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Déconnexion</text></a><rect x="236" y="0" width="1204" height="82" rx="0" fill="white" /><text x="276" y="49" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Espace professionnel  /  Cogérance</text><rect x="1134" y="27" width="136" height="28" rx="14" fill="#58AB29" /><text x="1146" y="46" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Données fictives</text><text x="276" y="137" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="650">Équipe</text><text x="276" y="169" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Vendredi 16 octobre 2026 • Heure de Nouvelle-Calédonie</text><rect x="276" y="224" width="1108" height="48" rx="8" fill="#F0F3F5" /><text x="292" y="254" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Organisation</text><text x="542" y="254" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Composition</text><text x="1012" y="254" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Fonction</text><rect x="276" y="272" width="1108" height="65" rx="0" fill="white" /><text x="292" y="310" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Binôme fixe 1</text><text x="542" y="310" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Agent A + Agent B (exemple)</text><text x="1012" y="310" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Ménage</text><rect x="276" y="338" width="1108" height="65" rx="0" fill="white" /><text x="292" y="376" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Binôme fixe 2</text><text x="542" y="376" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Composition à renseigner</text><text x="1012" y="376" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Ménage</text><rect x="276" y="404" width="1108" height="65" rx="0" fill="white" /><text x="292" y="442" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Binôme fixe 3</text><text x="542" y="442" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Composition à renseigner</text><text x="1012" y="442" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Ménage</text><rect x="276" y="470" width="1108" height="65" rx="0" fill="white" /><text x="292" y="508" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Binôme fixe 4</text><text x="542" y="508" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Composition à renseigner</text><text x="1012" y="508" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Ménage</text><rect x="276" y="536" width="1108" height="65" rx="0" fill="white" /><text x="292" y="574" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Employés solos</text><text x="542" y="574" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Autres employés</text><text x="1012" y="574" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Ménage sur leur chantier</text><rect x="276" y="602" width="1108" height="65" rx="0" fill="white" /><text x="292" y="640" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">2 contrôleuses</text><text x="542" y="640" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Employées de ménage</text><text x="1012" y="640" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Ménage + coordination</text><rect x="276" y="694" width="1108" height="180" rx="14" fill="white" /><text x="300" y="729" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Coordination et prestations : deux fonctions distinctes</text><text x="300" y="758" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Les contrôleuses encadrent les équipes sous les ordres de la secrétaire et des cogérants.</text><text x="300" y="788" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Sur les gros chantiers, elles coordonnent les équipes et les besoins de renfort.</text><text x="300" y="818" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Leur disponibilité pour effectuer du ménage doit être vérifiée séparément.</text><text x="300" y="918" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Absence dans un binôme, sélection des renforts et validation des changements : à préciser.</text></svg>