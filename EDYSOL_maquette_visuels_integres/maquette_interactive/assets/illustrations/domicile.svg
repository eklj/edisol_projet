<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration provisoire : un séjour lumineux de particulier après entretien</title>
  <!-- Illustration vectorielle de démonstration (maquette ÉDYSOL) : ce n'est pas une photo de chantier. -->
  <defs><linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#ffeec7"/><stop offset="1" stop-color="#8fd3e6"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="#f5f1ea"/>
  <!-- Fenêtre ouverte sur la mer en fin de journée -->
  <rect x="860" y="100" width="560" height="520" rx="8" fill="url(#ciel)"/>
  <circle cx="1140" cy="430" r="80" fill="#fff4d6"/>
  <rect x="860" y="470" width="560" height="150" fill="#2c9fb8"/>
  <path d="M860 520 H1420 M860 570 H1420" stroke="#bdeef4" stroke-width="5" opacity=".6"/>
  <path d="M860 470 L1000 400 L1120 450 L1260 380 L1420 440 L1420 470 Z" fill="#3e7a55"/>
  <g fill="none" stroke="#ffffff" stroke-width="22"><rect x="860" y="100" width="560" height="520" rx="8"/><path d="M1140 100 V620"/></g>
  <!-- Rideau -->
  <path d="M820 80 C800 300 840 500 810 650 L760 650 C780 480 760 280 770 80 Z" fill="#4fb748"/>
  <rect x="740" y="70" width="720" height="18" rx="9" fill="#0b3a66"/>
  <!-- Sol parquet -->
  <rect x="0" y="650" width="1600" height="350" fill="#d9b98f"/>
  <g stroke="#c49e70" stroke-width="4"><path d="M0 720 H1600 M0 800 H1600 M0 890 H1600 M200 650 V720 M700 720 V800 M380 800 V890 M1100 650 V720 M1300 800 V890 M900 890 V1000"/></g>
  <ellipse cx="600" cy="820" rx="420" ry="80" fill="#1956a7" opacity=".85"/>
  <ellipse cx="600" cy="820" rx="360" ry="60" fill="none" stroke="#f9dd18" stroke-width="8"/>
  <!-- Canapé et table basse -->
  <rect x="140" y="470" width="560" height="200" rx="40" fill="#0b3a66"/>
  <rect x="110" y="540" width="620" height="150" rx="40" fill="#14497d"/>
  <rect x="190" y="500" width="150" height="110" rx="24" fill="#f9dd18"/>
  <rect x="490" y="500" width="150" height="110" rx="24" fill="#ffffff"/>
  <rect x="150" y="690" width="22" height="50" fill="#1d2a33"/><rect x="668" y="690" width="22" height="50" fill="#1d2a33"/>
  <rect x="420" y="780" width="360" height="26" rx="12" fill="#ffffff"/>
  <path d="M450 806 V870 M750 806 V870" stroke="#9aa9b4" stroke-width="12"/>
  <!-- Plante et étincelles de propreté -->
  <rect x="1460" y="560" width="90" height="110" rx="14" fill="#ffffff"/>
  <path d="M1505 560 C1470 470 1430 450 1400 460 C1440 480 1475 520 1500 560 Z M1505 560 C1540 470 1580 450 1600 460 C1570 480 1535 520 1510 560 Z" fill="#4fb748"/>
  <g fill="#ffffff"><path d="M640 760 l10 -30 l10 30 l30 10 l-30 10 l-10 30 l-10 -30 l-30 -10 Z"/><path d="M300 430 l7 -20 l7 20 l20 7 l-20 7 l-7 20 l-7 -20 l-20 -7 Z"/></g>
</svg>
