<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Mes activités"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F5F7F8" /><rect x="0" y="0" width="390" height="113" rx="0" fill="#085895" /><text x="22" y="42" fill="white" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">édysol</text><text x="22" y="76" fill="#EDF2F6" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600">ESPACE CONTRÔLEUSE</text><text x="22" y="152" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650">Mes activités</text><text x="22" y="184" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">2 contrôleuses · employées de ménage</text><rect x="16" y="214" width="358" height="170" rx="14" fill="white" /><text x="40" y="249" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Mes prestations</text><text x="40" y="292" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Affectations de ménage à consulter</text><text x="40" y="318" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">dans le planning ; disponibilité</text><text x="40" y="344" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">à vérifier avant toute intervention.</text><rect x="16" y="407" width="358" height="225" rx="14" fill="white" /><text x="40" y="442" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Coordination des équipes</text><text x="40" y="482" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Sous les ordres de la secrétaire</text><text x="40" y="508" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">et des cogérants. Coordination</text><text x="40" y="534" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">sur les gros chantiers avec renfort.</text><a href="#su-chantier" data-target="su-chantier"><rect x="40" y="558" width="310" height="44" rx="9" fill="#085895" /><text x="56" y="586" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Voir la coordination</text></a><text x="22" y="684" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Coordonner un chantier ne signifie pas</text><text x="22" y="710" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">être disponible pour y faire du ménage.</text><a href="#connexion" data-target="connexion"><rect x="22" y="756" width="346" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="38" y="784" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Retour aux espaces</text></a></svg>