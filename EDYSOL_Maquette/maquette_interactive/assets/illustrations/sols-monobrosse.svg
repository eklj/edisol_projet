<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration provisoire : lavage mécanisé d'un sol de hall à la monobrosse</title>
  <!-- Illustration vectorielle de démonstration (maquette ÉDYSOL) : ce n'est pas une photo de chantier. -->
  <defs>
    <linearGradient id="mur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f4a80"/><stop offset="1" stop-color="#1b5f9c"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef1"/><stop offset="1" stop-color="#cfd9df"/></linearGradient>
    <radialGradient id="brillance" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#mur)"/>
  <!-- Hall : piliers et ouvertures lumineuses -->
  <g fill="#e8f3f9" opacity=".95">
    <rect x="140" y="120" width="260" height="480" rx="130"/>
    <rect x="520" y="120" width="260" height="480" rx="130"/>
    <rect x="900" y="120" width="260" height="480" rx="130"/>
  </g>
  <g fill="#4fb748" opacity=".9">
    <circle cx="270" cy="470" r="70"/><circle cx="210" cy="520" r="55"/><circle cx="330" cy="525" r="55"/>
    <circle cx="1030" cy="480" r="65"/><circle cx="975" cy="530" r="50"/><circle cx="1090" cy="530" r="50"/>
  </g>
  <rect x="0" y="590" width="1600" height="16" fill="#f9dd18"/>
  <!-- Sol avec zone déjà lavée plus brillante -->
  <rect x="0" y="606" width="1600" height="394" fill="url(#sol)"/>
  <path d="M0 606 L700 606 L520 1000 L0 1000 Z" fill="#f6fafc"/>
  <ellipse cx="300" cy="760" rx="260" ry="60" fill="url(#brillance)"/>
  <g stroke="#b7c5ce" stroke-width="3"><path d="M0 720 H1600 M0 860 H1600 M400 606 L300 1000 M800 606 L800 1000 M1200 606 L1300 1000"/></g>
  <!-- Panneau sol glissant (sans texte) -->
  <g transform="translate(1380 760)">
    <path d="M-60 140 L0 -40 L60 140 Z" fill="#f9dd18" stroke="#0b3a66" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="0" cy="40" r="16" fill="#0b3a66"/><path d="M-20 100 C0 70 20 70 30 100" stroke="#0b3a66" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Personne poussant la monobrosse -->
  <g transform="translate(980 470)">
    <ellipse cx="-80" cy="455" rx="260" ry="20" fill="#0b3a66" opacity=".14"/>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M20 260 L60 440" stroke="#0b3a66" stroke-width="40"/>
      <path d="M-20 260 L-60 440" stroke="#0b3a66" stroke-width="40"/>
      <path d="M60 440 h36 M-60 440 h-34" stroke="#1d2a33" stroke-width="26"/>
      <path d="M-10 110 C-60 160 -110 200 -150 230" stroke="#7a5236" stroke-width="28"/>
      <path d="M-150 228 L-330 400" stroke="#9aa9b4" stroke-width="16"/>
      <path d="M-175 210 L-125 250" stroke="#1d2a33" stroke-width="18"/>
    </g>
    <path d="M-55 80 C-55 40 55 40 55 80 L65 270 L-65 270 Z" fill="#0b3a66"/>
    <circle cx="0" cy="10" r="48" fill="#7a5236"/>
    <path d="M-44 -6 C-40 -60 40 -62 46 -10 C20 -34 -16 -34 -44 -6 Z" fill="#23170f"/>
    <path d="M-20 110 C-70 160 -110 200 -150 230" stroke="#0b3a66" stroke-width="30" stroke-linecap="round" fill="none"/>
    <!-- Machine -->
    <rect x="-420" y="380" width="180" height="60" rx="22" fill="#1956a7"/>
    <ellipse cx="-330" cy="448" rx="120" ry="18" fill="#4fb748"/>
    <ellipse cx="-330" cy="458" rx="140" ry="14" fill="#bfe8f7" opacity=".9"/>
  </g>
</svg>
