<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration provisoire : nettoyage d'une grande baie vitrée à la raclette</title>
  <!-- Illustration vectorielle de démonstration (maquette ÉDYSOL) : ce n'est pas une photo de chantier. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc6ea"/><stop offset="1" stop-color="#dff2fa"/></linearGradient>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb0c4"/><stop offset="1" stop-color="#14779b"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#e9f0f4"/>
  <!-- Paysage derrière la vitre -->
  <rect x="80" y="70" width="1440" height="700" fill="url(#ciel)"/>
  <circle cx="1280" cy="200" r="70" fill="#fff6c2"/>
  <path d="M80 520 L300 430 L520 480 L760 380 L1000 470 L1250 400 L1520 470 L1520 560 L80 560 Z" fill="#4e8c63"/>
  <rect x="80" y="550" width="1440" height="220" fill="url(#mer)"/>
  <path d="M80 610 H1520 M80 680 H1520" stroke="#c8f3f7" stroke-width="5" opacity=".5"/>
  <g fill="#285f3f">
    <path d="M300 770 C310 660 300 560 330 470" stroke="#6b4f35" stroke-width="18" fill="none"/>
    <path d="M330 470 C270 440 210 460 180 510 C250 485 295 482 330 475 Z M330 470 C390 430 450 450 480 490 C420 470 370 470 330 475 Z M330 470 C320 410 340 370 380 350 C360 395 345 430 333 472 Z"/>
  </g>
  <!-- Zone propre (reflets nets) et zone encore voilée -->
  <rect x="820" y="70" width="700" height="700" fill="#ffffff" opacity=".38"/>
  <g stroke="#ffffff" stroke-width="10" opacity=".7" stroke-linecap="round"><path d="M200 180 L320 120 M240 240 L420 150 M560 200 L640 160"/></g>
  <!-- Menuiseries -->
  <g fill="none" stroke="#f7fafc" stroke-width="26"><rect x="80" y="70" width="1440" height="700"/><path d="M560 70 V770 M1040 70 V770"/></g>
  <rect x="0" y="770" width="1600" height="230" fill="#cdd8de"/>
  <rect x="0" y="770" width="1600" height="14" fill="#f9dd18"/>
  <!-- Seau -->
  <g transform="translate(1180 860)"><path d="M-60 -60 L60 -60 L45 80 L-45 80 Z" fill="#1956a7"/><path d="M-60 -60 C-60 -120 60 -120 60 -60" stroke="#0b3a66" stroke-width="8" fill="none"/><ellipse cx="0" cy="-60" rx="60" ry="12" fill="#bfe8f7"/></g>
  <!-- Personne avec raclette -->
  <g transform="translate(880 470)">
    <ellipse cx="0" cy="455" rx="150" ry="18" fill="#0b3a66" opacity=".14"/>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-15 260 L-35 440" stroke="#0b3a66" stroke-width="40"/>
      <path d="M25 260 L55 440" stroke="#0b3a66" stroke-width="40"/>
      <path d="M-35 440 h-34 M55 440 h36" stroke="#1d2a33" stroke-width="26"/>
      <path d="M-30 90 C-70 40 -100 -60 -110 -150" stroke="#0b3a66" stroke-width="30"/>
      <path d="M-110 -150 L-130 -230" stroke="#7a5236" stroke-width="26"/>
      <path d="M-130 -230 L-150 -340" stroke="#9aa9b4" stroke-width="12"/>
      <path d="M-230 -350 L-70 -335" stroke="#4fb748" stroke-width="20"/>
    </g>
    <path d="M-55 80 C-55 40 55 40 55 80 L65 270 L-65 270 Z" fill="#0b3a66"/>
    <circle cx="0" cy="10" r="48" fill="#7a5236"/>
    <path d="M-46 0 C-48 -58 44 -64 48 -8 C40 -40 -22 -42 -46 0 Z" fill="#23170f"/>
    <path d="M40 100 C70 160 80 200 70 240" stroke="#0b3a66" stroke-width="28" stroke-linecap="round" fill="none"/>
  </g>
</svg>
