# Laboratoire local proposé pour le guide, sans service externe ni données réelles.
name: edysol-n8n-test
services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:?Renseigner N8N_VERSION dans .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    environment:
      TZ: Pacific/Noumea
      GENERIC_TIMEZONE: Pacific/Noumea
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: 5678
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_LOCAL_PORT:-5678}/
      N8N_WEBHOOK_URL: http://localhost:${N8N_LOCAL_PORT:-5678}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Generer une cle locale dans .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./exemples:/exemples:ro
      - ./exports:/exports
volumes:
  n8n_data:
