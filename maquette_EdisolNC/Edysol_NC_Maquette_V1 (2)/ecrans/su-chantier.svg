<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Coordination chantier"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7F6"/><rect x="0" y="0" width="390" height="113" rx="0" fill="#102E38"/><text x="22" y="42" fill="white" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">édysol</text><text x="22" y="76" fill="#BCD0D1" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600">ESPACE SUPERVISEUSE</text><text x="22" y="152" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650">Coordination chantier</text><rect x="16" y="194" width="358" height="244" rx="14" fill="white"/><text x="40" y="229" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Équipe et besoins</text><text x="40" y="266" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Équipes prévues : à renseigner.</text><text x="40" y="295" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Binômes fixes et employés solos.</text><text x="40" y="324" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Besoin de renfort : à examiner.</text><text x="40" y="353" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Affectation ménage de la superviseuse :</text><text x="40" y="382" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">à vérifier dans le planning.</text><rect x="16" y="460" width="358" height="206" rx="14" fill="white"/><text x="40" y="495" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Règles restant à définir</text><text x="40" y="530" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Absence dans un binôme fixe.</text><text x="40" y="562" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Sélection des renforts.</text><text x="40" y="594" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Validation des changements.</text><a href="#s-detail" data-target="s-detail"><rect x="22" y="696" width="346" height="44" rx="9" fill="#136B52"/><text x="38" y="724" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Signaler le besoin (démo)</text></a><a href="#su-accueil" data-target="su-accueil"><rect x="22" y="756" width="346" height="44" rx="9" fill="white" stroke="#DCE6E5"/><text x="38" y="784" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Retour à mes activités</text></a></svg>