    <style>
      * {
        box-sizing:border-box
      }
      body {
        margin:0;
        font-family:Arial,sans-serif;
        background:#e3eae8;
        color:#102e38
      }
      header {
        padding:16px 24px;
        background:#102e38;
        color:white;
        display:flex;
        align-items:center;
        gap:24px;
        position:sticky;
        top:0;
        z-index:3
      }
      header b {
        font-size:22px
      }
      header span {
        font-size:13px;
        color:#bcd0d1
      }
      main {
        display:grid;
        grid-template-columns:260px 1fr;
        min-height:90vh
      }
      aside {
        background:white;
        padding:20px;
        height:calc(100vh - 60px);
        overflow:auto;
        position:sticky;
        top:60px
      }
      h3 {
        font-size:11px;
        text-transform:uppercase;
        letter-spacing:1px;
        margin:24px 0 10px;
        color:#657b82
      }
      button {
        display:block;
        border:0;
        background:transparent;
        text-align:left;
        color:#102e38;
        padding:10px;
        border-radius:6px;
        cursor:pointer;
        width:100%;
        font:13px Arial
      }
      button:hover,button.active {
        background:#e8f4ee;
        color:#136b52
      }
      article {
        padding:24px;
        overflow:hidden
      }
      #info {
        font-size:13px;
        color:#526b70;
        margin-bottom:18px
      }
      #frame {
        margin:auto;
        max-width:1440px;
        box-shadow:0 12px 48px #102e3815
      }
      svg {
        width:100%;
        height:auto;
        display:block
      }
      svg a {
        cursor:pointer
      }
      svg a:hover rect {
        filter:brightness(.95)
      }
      a:focus-visible {
        outline:3px solid #bb8a1b
      }
      #frame.mobile {
        max-width:390px
      }
      footer {
        padding:24px;
        font-size:12px;
        color:#657b82
      }
      @media(max-width:760px) {
        main {
          display:block
        }
        aside {
          height:auto;
          position:relative;
          top:0;
          max-height:220px
        }
        article {
          padding:8px
        }
        header span {
          display:none
        }
      }
    </style>
  </head>

      const nav = document.querySelector('#nav');
      let last = '';

      for (const s of screens) {
        if (s.group !== last) {
          const h = document.createElement('h3');
          h.textContent = s.group;
          nav.append(h);
          last = s.group;
        }

        const b = document.createElement('button');
        b.textContent = s.title;
        b.dataset.id = s.id;
        b.onclick = () => location.hash = s.id;
        nav.append(b);
      }

      function show() {
        const s = screens.find(s => s.id === location.hash.slice(1)) || screens[0];
        const f = document.querySelector('#frame');

        f.innerHTML = s.svg;
        f.className = s.mobile ? 'mobile' : '';

        document.querySelector('#info').textContent =
          s.group + ' / ' + s.title + ' — ' +
          (s.mobile ? '390 × 844' : '1440 × 1000');

        document.querySelectorAll('button').forEach(b =>
          b.classList.toggle('active', b.dataset.id === s.id)
        );

        document.title = s.title + ' — Édysol';
      }

      addEventListener('hashchange', show);
      show();
