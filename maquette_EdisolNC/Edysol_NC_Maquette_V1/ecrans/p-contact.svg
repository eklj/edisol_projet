if" font-size="18" font-weight="600">Contacter le secrétariat</text><text x="90" y="324" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Téléphone : à renseigner</text><text x="90" y="372" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">E-mail : à renseigner</text><text x="90" y="420" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Adresse : à confirmer</text><text x="90" y="468" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Horaires d’accueil : à confirmer</text><text x="90" y="566" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Vous préférez passer par la secrétaire ?</text><text x="90" y="606" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Elle peut enregistrer votre commande</text><text x="90" y="632" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">et convenir d’un rendez-vous avec vous.</text><rect x="650" y="244" width="726" height="560" rx="14" fill="white"/><text x="674" y="279" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Demander à être recontacté</text><text x="678" y="326" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Nom et prénom</text><rect x="678" y="338" width="660" height="48" rx="8" fill="white" stroke="#DCE6E5"/><text x="692" y="368" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Votre nom</text><text x="678" y="420" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Téléphone ou e-mail</text><rect x="678" y="432" width="660" height="48" rx="8" fill="white" stroke="#DCE6E5"/><text x="692" y="462" fill="#102E38" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Vos coordonnées</text><text x="678" y="514" fill="#657B82" fo