ont-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Compte de démonstration</text><a href="#connexion" data-target="connexion"><rect x="24" y="938" width="188" height="44" rx="9" fill="white" stroke="#DCE3E8" /><text x="40" y="966" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Déconnexion</text></a><rect x="236" y="0" width="1204" height="82" rx="0" fill="white" /><text x="276" y="49" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Espace professionnel  /  Secrétariat</text><rect x="1134" y="27" width="136" height="28" rx="14" fill="#58AB29" /><text x="1146" y="46" fill="#202B33" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Données fictives</text><text x="276" y="137" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="650">Véhicules de service</text><text x="276" y="169" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Vendredi 16 octobre 2026 • Heure de Nouvelle-Calédonie</text><rect x="276" y="228" width="1108" height="48" rx="8" fill="#F0F3F5" /><text x="292" y="258" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Véhicule / immatriculation</text><text x="832" y="258" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Dernier compteur</text><text x="1122" y="258" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Date du relevé</text><rect x="276" y="276" width="1108" height="65" rx="0" fill="white" /><text x="292" y="314" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">V-DÉMO-01 · 000001 NC (fictif)</text><text x="832" y="314" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">123450 km</text><text x="1122" y="314" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">26/10 · 18:00</text><rect x="276" y="342" width="1108" height="65" rx="0" fill="white" /><text x="292" y="380" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">V-DÉMO-02 · 000002 NC (fictif)</text><text x="832" y="380" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">Aucun relevé</text><text x="1122" y="380" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500">—</text><a href="#s-releves" data-target="s-releves"><rect x="300" y="495" width="300" height="44" rx="9" fill="#085895" /><text x="316" y="523" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Historique V-DÉMO-01</text></a><rect x="276" y="600" width="1108" height="240" rx="14" fill="white" /><text x="300" y="635" fill="#085895" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Alimentation depuis les comptes rendus</text><text x="300" y="675" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Dernier relevé selon sa date réelle, même si la saisie arrive plus tard.</text><text x="300" y="708" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Les compteurs des employés ne sont jamais additionnés.</text><text x="300" y="741" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Anomalies, doublons et corrections restent identifiables.</text><text x="300" y="774" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Véhicules partagés : règles de saisie à préciser.</text></svg>