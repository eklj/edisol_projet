ight="600">Observations</text><rect x="22" y="455" width="346" height="154" rx="9" fill="white" stroke="#DCE6E5"/><text x="38" y="487" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">Décrivez le travail effectué,</text><text x="38" y="513" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">les difficultés ou le suivi nécessaire.</text><text x="22" y="647" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Le secrétariat et les cogérants pourront</text><text x="22" y="669" fill="#657B82" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">consulter ce compte rendu.</text><a href="#e-notifications" data-target="e-notifications"><rect x="22" y="706" width="346" height="44" rx="9" fill="#136B52"/><text x="38" y="734" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Enregistrer le compte rendu</text></a><rect x="0" y="788" width="390" height="56" rx="0" fill="white"/><a href="#e-jour" data-target="e-jour"><text x="22" y="822" fill="#136B52" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Mes missions</text></a><a href="#e-notifications" data-target="e-notifications"><text x="168" y="822" fill="#136B52" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Notifications</text></a><a href="#connexion" data-target="connexion"><text x="305" y="822" fill="#136B52" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Quitter</text></a></svg>